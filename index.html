<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/logoico.png" type="image/x-icon">
    <title>hefestoAuto</title>
    <link rel="stylesheet" href="style/index.css">
</head>

<body>
    <!-- sera que vale a pena ser programador web???-->
    <!-- CABEÇALHO -->
    <HEADER>
        <div class="topo">
            <div class="logo">
                <img src="assets/logoico.png" alt="logo hefesto auto">
            </div>

            <div class="caixa-de-pesquisa">
                <img src="assets/search.png" alt="pesquisar">
                <input type="text" placeholder="oque você procura?">
            </div>

            <div class="icones">
                <a href="#"><img src="assets/shopping-cart.png" alt="carrinho de compras"></a>
                <a href="#"><img src="assets/user.png" alt="usuario"></a>

            </div>
        </div>
        </div>



        <NAV class="menu">

            <! -- dentro dos 3 pontos... --!>

                <A HREF="#">motor</A>
                <a id="idsobrenos" href="#">suspensão</a>
                <a href="#">peças de alta performance</a>
                <a href="#">acessórios</a>
                <a href="#">rolamento</a>

        </NAV>


    </HEADER>



    <div class="banner">
        <div class="imagens-banner">
            <img src="assets/promoção relampago. (1).png" alt="banner 1">
        </div>
        <div class="botoes-banner">
            <button class="btn-comprar">comprar</button>
            <button class="btn-anterior">
                <img src="assets/angle-left.png" alt="anterior">

            </button>

            <button class="btn-próximo">
                <img src="assets/angle-right.png" alt="próximo">

            </button>


        </div>
    </div>
    <section class="ofertas">

        <div class="titulo-ofertas">
            <div class="texto-promocoes">
                <h2>ofertas do dia</h2>
                <p>confira nossas melhores ofertas!</p>
            </div>
            <a href="#" class="ver-mais">ver mais</a>

        </div>

        <div class="lista-de-produtos">

            <div class="card-produtos">
                <img src="assets/kit emb (1).png" alt="produto 1">
                <h3>kit de embreagem</h3>
                <p>R$ 299,99</p>
            </div>
            <div class="card-produtos">
                <img src="assets/pneu (1).png" alt="produto 2">
                <h3>kit de freio</h3>
                <p>R$ 199,99</p>
            </div>
            <div class="card-produtos">
                <img src="assets/Design sem nome (1).png" alt="produto 3">
                <h3>kit de suspensão</h3>
                <p>R$ 399,99</p>
            </div>
        </div>
    </section>

</BODY>

</html>
