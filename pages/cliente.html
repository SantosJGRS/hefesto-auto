<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes | Hefesto Autopeças</title>
    
    <link rel="stylesheet" href="../style/cliente.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-car-side"></i>
                <h2>Hefesto <span>Auto</span></h2>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                
                <a href="cadastro_produto.html" class="nav-item">
                    <i class="fa-solid fa-box"></i>
                    <span>Produtos</span>
                </a>
                
                <a href="cliente.html" class="nav-item active">
                    <i class="fa-solid fa-users"></i>
                    <span>Clientes</span>
                </a>
                
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Relatórios</span>
                </a>
                
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            
            <header class="top-header">
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name">Administrador</span>
                        <span class="user-role">Hefesto Autopeças</span>
                    </div>
                    <div class="user-avatar">
                        AD
                    </div>
                </div>
            </header>

            <div class="page-container">
                
                <div class="page-header">
                    <div>
                        <h1>Gestão de Clientes</h1>
                        <p>Gerencie todos os clientes da plataforma Hefesto Autopeças</p>
                    </div>
                </div>

                <div class="action-toolbar">
                    <div class="toolbar-left">
                        <button class="btn-primary" id="btnAdicionar">
                            <i class="fa-solid fa-plus"></i>
                            Adicionar Novo
                        </button>
                        <button class="btn-secondary">
                            <i class="fa-solid fa-filter"></i>
                            Filtros
                        </button>
                    </div>
                    <div class="toolbar-right">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="inputBusca" placeholder="Buscar clientes...">
                        </div>
                    </div>
                </div>

                <div class="card-table">
                    <div class="card-header">
                        <h3>Clientes Cadastrados</h3>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th width="80">ID</th>
                                    <th>CLIENTE</th>
                                    <th>CONTATO</th>
                                    <th>STATUS</th>
                                    <th width="100">AÇÕES</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaClientes">
                                </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <button class="page-btn">Anterior</button>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                        <button class="page-btn">3</button>
                        <button class="page-btn">Próximo</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/cliente.js"></script>
</body>
</html>
