<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Hefesto Autopeças</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../style/login.css">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>


<body>


    <!-- ==========================================
         PÁGINA DE LOGIN
    =========================================== -->

    <main class="login-page">


        <!-- ======================================
             CONTAINER PRINCIPAL
        ======================================= -->

        <section class="login-container">


            <!-- ==================================
                 LADO DO FORMULÁRIO
            =================================== -->

            <div class="login-right">


                <!-- ==============================
                     CABEÇALHO
                =============================== -->

                <div class="form-header">

                    <h2>
                        Entrar
                    </h2>

                    <div class="title-line"></div>

                </div>


                <!-- ==============================
                     FORMULÁRIO
                =============================== -->

                <form
                    id="loginForm"
                    class="login-form"
                    novalidate>


                    <!-- ==========================
                         E-MAIL
                    =========================== -->

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="seuemail@exemplo.com"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    <!-- ==========================
                         SENHA
                    =========================== -->

                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required>


                            <!-- MOSTRAR SENHA -->

                            <button
                                type="button"
                                id="toggleSenha"
                                class="password-toggle"
                                aria-label="Mostrar senha">

                                <i
                                    class="fa-regular fa-eye">
                                </i>

                            </button>

                        </div>

                    </div>


                    <!-- ==========================
                         OPÇÕES
                    =========================== -->

                    <div class="login-options">


                        <!-- LEMBRAR DE MIM -->

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="lembrar"
                                name="lembrar">

                            <span class="checkmark"></span>

                            <span>
                                Lembrar de mim
                            </span>

                        </label>


                        <!-- ESQUECI A SENHA -->

                        <button
                            type="button"
                            id="btnEsqueciSenha"
                            class="forgot-password">

                            Esqueceu a senha?

                        </button>

                    </div>


                    <!-- ==========================
                         BOTÃO ENTRAR
                    =========================== -->

                    <button
                        type="submit"
                        id="btnEntrar"
                        class="btn-primary">

                        Entrar

                    </button>

                </form>


                <!-- ==============================
                     SEPARADOR
                =============================== -->

                <div class="separator">

                    <div class="line"></div>

                    <span>
                        ou
                    </span>

                    <div class="line"></div>

                </div>


                <!-- ==============================
                     GOOGLE
                =============================== -->

                <button
                    type="button"
                    id="btnGoogle"
                    class="google-button">

                    <img
                        src="../assets/google.png"
                        alt="Google">

                    <span>
                        Continuar com Google
                    </span>

                </button>


                <!-- ==============================
                     CRIAR CONTA
                =============================== -->

                <div class="register-area">

                    <span>
                        Ainda não possui uma conta?
                    </span>

                    <button
                        type="button"
                        id="btnCriarConta">

                        Criar conta

                    </button>

                </div>

            </div>


            <!-- ==================================
                 LADO DA MARCA
            =================================== -->

            <div class="login-brand">


                <!-- LOGO -->

                <img
                    src="../assets/hefesto_auto_logo.ico"
                    alt="Hefesto Autopeças"
                    class="brand-logo">


                <!-- NOME -->

                <h1>

                    Hefesto

                    <span>
                        Autopeças
                    </span>

                </h1>


                <!-- DESCRIÇÃO -->

                <p>

                    Peças de qualidade para manter
                    seu veículo sempre em movimento.

                </p>

            </div>


        </section>


        <!-- ======================================
             RODAPÉ
        ======================================= -->

        <footer class="login-footer">

            <span>
                © 2026 Hefesto Autopeças
            </span>


            <button
                type="button"
                id="btnPrivacidade">

                Privacidade

            </button>


            <button
                type="button"
                id="btnTermos">

                Termos

            </button>


            <button
                type="button"
                id="btnSuporte">

                Suporte

            </button>

        </footer>


    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="../js/login.js"></script>


</body>

</html>
