<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Hefesto Autopeças</title>

    <link rel="stylesheet" href="../style/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <div class="login-right">

                <div class="form-header">
                    <h2>
                        Criar Conta
                    </h2>
                    <p class="form-subtitle">
                        Preencha os dados abaixo para se cadastrar.
                    </p>
                    <div class="title-line"></div>
                </div>

                <form id="cadastroForm" class="login-form" novalidate>

                    <div class="form-group">
                        <label for="nome">
                            Nome Completo
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="nome" 
                                name="nome" 
                                placeholder="Digite seu nome completo" 
                                autocomplete="name" 
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">
                            E-mail
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="Digite seu e-mail" 
                                autocomplete="email" 
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="senha">
                            Senha
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="senha" 
                                name="senha" 
                                placeholder="Digite sua senha" 
                                autocomplete="new-password" 
                                required>

                            <button 
                                type="button" 
                                id="toggleSenha" 
                                class="password-toggle" 
                                aria-label="Mostrar senha">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cpf">
                            CPF
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="cpf" 
                                name="cpf" 
                                placeholder="Digite seu CPF" 
                                autocomplete="off" 
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="telefone">
                            Telefone
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="tel" 
                                id="telefone" 
                                name="telefone" 
                                placeholder="Digite seu telefone" 
                                autocomplete="tel" 
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nascimento">
                            Data de Nascimento
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="nascimento" 
                                name="nascimento" 
                                placeholder="dd/mm/aaaa" 
                                autocomplete="bday" 
                                required>
                        </div>
                    </div>

                    <button type="submit" id="btnCadastrar" class="btn-primary">
                        Cadastrar
                    </button>

                </form>

                <div class="separator">
                    <div class="line"></div>
                    <span>ou</span>
                    <div class="line"></div>
                </div>

                <div class="register-area">
                    <span>
                        Já tem uma conta?
                    </span>
                    <button type="button" id="btnIrLogin" onclick="window.location.href='login.html'">
                        Entrar
                    </button>
                </div>

            </div>

            <div class="login-brand">
                <img src="../assets/hefesto_auto_logo.ico" alt="Hefesto Autopeças" class="brand-logo">

                <h1>
                    Hefesto
                    <span>
                        Autopeças
                    </span>
                </h1>

                <p>
                    Crie sua conta e tenha acesso a ofertas exclusivas, acompanhe seus pedidos e muito mais.
                </p>
            </div>

        </section>

        <footer class="login-footer">
            <span>
                © 2026 Hefesto Autopeças
            </span>

            <button type="button" id="btnPrivacidade">
                Privacidade
            </button>

            <button type="button" id="btnTermos">
                Termos
            </button>

            <button type="button" id="btnSuporte">
                Suporte
            </button>
        </footer>

    </main>

    <script src="../js/cadastro.js"></script>

</body>

</html>
