<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Hefesto Auto</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-principal">HEFESTO</span>
            <span class="logo-sub">AUTO</span>
        </div>
        <button class="btn-entrar">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
        </button>
    </header>

    <main>
        <div class="cadastro-card">
            
            <div class="icone-topo">
                <i class="fa-regular fa-user"></i>
            </div>
            
            <h1 class="titulo">Crie Sua <span>Conta</span></h1>
            <div class="linha-vermelha"></div>
            <p class="subtitulo">Preencha seus dados para acessar a plataforma.</p>

            <form action="#" method="POST">
                
                <div class="campo">
                    <label><i class="fa-regular fa-address-card"></i> Nome</label>
                    <div class="input-box">
                        <input type="text" placeholder="Seu nome completo" required>
                    </div>
                </div>

                <div class="campo">
                    <label><i class="fa-regular fa-envelope"></i> E-mail</label>
                    <div class="input-box">
                        <input type="email" placeholder="Seu melhor e-mail" required>
                    </div>
                </div>

                <div class="campo">
                    <label><i class="fa-solid fa-lock"></i> Senha</label>
                    <div class="input-box">
                        <input type="password" placeholder="Crie uma senha forte" required>
                        <i class="fa-regular fa-eye icone-senha"></i>
                    </div>
                </div>

                <button type="submit" class="btn-criar">CRIAR CONTA</button>

                <div class="divisor-ou">
                    <span>OU</span>
                </div>

                <p class="link-login">
                    Já possui conta? <a href="login.html">Faça login</a>
                </p>

            </form>
        </div>
    </main>
<script src="cadastro.js"></script>
</body>
</html>
