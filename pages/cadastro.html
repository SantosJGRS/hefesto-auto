<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link
        rel="stylesheet"
        href="../style/cadastro.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <main class="register-page">

        <section class="register-container">

            <!-- ===================================== -->
            <!-- COLUNA ESQUERDA -->
            <!-- ===================================== -->

            <div class="register-left">

                <div class="brand-area">

                    <img
                        id="logo"
                        src=""
                        alt="Logo">

                </div>

                <h1 id="tituloCadastro"></h1>

                <p id="descricaoLinha1"></p>

                <p id="descricaoLinha2"></p>

            </div>

            <!-- ===================================== -->
            <!-- DIVISOR -->
            <!-- ===================================== -->

            <div class="divider"></div>

            <!-- ===================================== -->
            <!-- COLUNA DIREITA -->
            <!-- ===================================== -->

            <div class="register-right">

                <div class="form-header">

                    <h2 id="tituloFormulario"></h2>

                    <p id="descricaoFormulario"></p>

                </div>

                <!-- NOME -->

                <div class="form-group">

                    <label
                        id="labelNome"
                        for="nome">
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="nome">

                    </div>

                </div>

                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        id="labelEmail"
                        for="email">
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email">

                    </div>

                </div>

                <!-- SENHA -->

                <div class="form-group">

                    <label
                        id="labelSenha"
                        for="senha">
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="senha">

                        <button
                            type="button"
                            id="toggleSenha"
                            class="icon-button">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- CONFIRMAR SENHA -->

                <div class="form-group">

                    <label
                        id="labelConfirmarSenha"
                        for="confirmarSenha">
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmarSenha">

                        <button
                            type="button"
                            id="toggleConfirmarSenha"
                            class="icon-button">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- BOTÃO CADASTRO -->

                <button
                    id="btnCriarConta"
                    type="button"
                    class="btn-primary">
                </button>

                <!-- SEPARADOR -->

                <div class="separator">

                    <div class="line"></div>

                    <span id="textoSeparador"></span>

                    <div class="line"></div>

                </div>

                <!-- GOOGLE -->

                <button
                    id="btnGoogle"
                    type="button"
                    class="google-button">

                    <img
                        id="googleIcon"
                        src=""
                        alt="Google">

                    <span id="googleTexto"></span>

                </button>

                <!-- LOGIN -->

                <div class="login-area">

                    <span id="textoLogin"></span>

                    <button
                        id="btnEntrar"
                        type="button">
                    </button>

                </div>

                <!-- TERMOS -->

                <div class="terms-area">

                    <p>

                        <span id="textoTermos1"></span>

                        <button
                            id="btnTermos"
                            type="button">
                        </button>

                    </p>

                    <p>

                        <span id="textoTermos2"></span>

                        <button
                            id="btnPrivacidade"
                            type="button">
                        </button>

                    </p>

                </div>

            </div>

        </section>

    </main>

    <script src="../js/cadastro.js"></script>

</body>

</html>
