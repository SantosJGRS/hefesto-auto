<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <!--conexão com o CSS-->
    <link rel="stylesheet" href="/style/produto.css">
    <!--logo da empresa para o navegador-->
    <link rel="icon" type="image/png" href="/assets/logo-navegador.png">
</head>

<body>
    <!--CABEÇALHO-->
     <HEADER>
        <div class="topo">
            <div class="logo">
                <img src="/assets/logoico.png" alt="logo hefesto auto">
            </div>

            <div class="caixa-de-pesquisa">
                <img src="/assets/search.png" alt="pesquisar">
                <input type="text" placeholder="oque você procura?">
            </div>

            <div class="icones">
                <a href="#"><img src="/assets/shopping-cart.png" alt="carrinho de compras"></a>
                <a href="#"><img src="/assets/user.png" alt="usuario"></a>

            </div>
        </div>
        </div>



        <NAV class="menu">

            <!-- dentro dos 3 pontos... -->

                <A HREF="#">motor</A>
                <a id="idsobrenos" href="#">suspensão</a>
                <a href="#">peças de alta performance</a>
                <a href="#">acessórios</a>
                <a href="#">rolamento</a>

        </NAV>


    </HEADER>

     <!--AREA DOS DADOS DO PRODUTO-->
    <div class="area-detalhes">

        <div class="area-imagens">
           
            <div class="img-principal" id="img-principal">
                <img id="imagem-maior">
            </div>
        </div>
        <div class="area-textos">
              <h1 id="nome-produto"></h1>
                     <div class="avaliacoes-produto">

                     </div> <img id="estrela-avaliacao">
                     <span id="valor-avaliacao"></span>                      
                      </div>
        </div>
             <p id="preco-antigo"></p>

             <div class="preco-promocional">
                 <p id="preco-promocional"></p>
                <span id="desconto"></span>
             </div>
             <div class="quantidade">
                <button id="diminuir"></button>
                <span id="numero-quantidade"></span>
                <button id="aumentar"></button>
             </div>
             <div class="btn-add-carrinho">
                  <button id="btn-add-carrinho"></button>


             </div>
             <div class="btn-comprar">
                 <button id="btn-comprar"></button>

             </div>
             <div class="area-frete">
                 <p>  calcular o frete</p>
                 <input id="frete">
                 <button id="btn-calcular-frete">frete</button>


             </div>




    </div>



     <!--FAZENDO A CONEXÃO COM O JAVASCRIPT-->
    <script src="/js/produto.js"></script>




</body>

</html>
